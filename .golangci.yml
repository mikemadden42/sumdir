version: "2"

linters:
  default: none
  enable:
    - errcheck # Unchecked errors, e.g. file.Close
    - gosec # Security issues, e.g. G304
    - revive # Missing doc comments
    - govet # Standard Go vetting
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments
  exclusions:
    paths:
      - third_party
      - builtin
      - examples

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mikemadden42
